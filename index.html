<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusSync - Campus Life Organizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'in': 'fadeIn 0.5s ease-out',
                        'zoom-in': 'zoomIn 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        zoomIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18",
        "react-dom/client": "https://esm.sh/react-dom@18/client",
        "lucide-react": "https://esm.sh/lucide-react"
      }
    }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            Calendar, CheckSquare, FileText, Plus, Trash2, X, MapPin, 
            BookOpen, Clock, AlertCircle, Link, ExternalLink, 
            ChevronRight, GraduationCap 
        } from 'lucide-react';

        function App() {
            const [activeTab, setActiveTab] = useState('timetable');

            // --- State: 時間割 ---
            const [timetable, setTimetable] = useState(() => {
                const saved = localStorage.getItem('campus_sync_timetable');
                return saved ? JSON.parse(saved) : {};
            });
            const [isClassModalOpen, setIsClassModalOpen] = useState(false);
            const [selectedCell, setSelectedCell] = useState(null);
            const [classForm, setClassForm] = useState({ name: '', room: '', teacher: '' });

            // --- State: 課題・Todo ---
            const [todos, setTodos] = useState(() => {
                const saved = localStorage.getItem('campus_sync_todos');
                return saved ? JSON.parse(saved) : [
                    { id: 1, text: 'レポートの提出（○○学）', deadline: '2026-05-20', completed: false },
                    { id: 2, text: 'サークルの出欠入力', deadline: '', completed: true },
                ];
            });
            const [newTodo, setNewTodo] = useState('');
            const [newDeadline, setNewDeadline] = useState('');

            // --- State: メモ ---
            const [memos, setMemos] = useState(() => {
                const saved = localStorage.getItem('campus_sync_memos');
                return saved ? JSON.parse(saved) : [
                    { id: 1, text: 'Wi-Fiのパスワード: campus-net / pass: 12345678', date: '2026-05-15' },
                ];
            });
            const [newMemo, setNewMemo] = useState('');

            // --- State: リンク ---
            const [links, setLinks] = useState(() => {
                const saved = localStorage.getItem('campus_sync_links');
                return saved ? JSON.parse(saved) : [
                    { id: 1, title: '大学ポータルサイト', url: 'https://example.com/portal' },
                    { id: 2, title: '図書館蔵書検索', url: 'https://example.com/library' },
                ];
            });
            const [newLinkTitle, setNewLinkTitle] = useState('');
            const [newLinkUrl, setNewLinkUrl] = useState('');

            // Persistence
            useEffect(() => { localStorage.setItem('campus_sync_timetable', JSON.stringify(timetable)); }, [timetable]);
            useEffect(() => { localStorage.setItem('campus_sync_todos', JSON.stringify(todos)); }, [todos]);
            useEffect(() => { localStorage.setItem('campus_sync_memos', JSON.stringify(memos)); }, [memos]);
            useEffect(() => { localStorage.setItem('campus_sync_links', JSON.stringify(links)); }, [links]);

            const days = ['月', '火', '水', '木', '金'];
            const periods = ['1限', '2限', '3限', '4限', '5限', '6限'];
            const periodTimes = ['09:00', '10:40', '13:00', '14:40', '16:20', '18:00'];

            const handleCellClick = (dayIndex, periodIndex) => {
                const key = `${dayIndex}-${periodIndex}`;
                setSelectedCell({ dayIndex, periodIndex, key });
                setClassForm(timetable[key] || { name: '', room: '', teacher: '' });
                setIsClassModalOpen(true);
            };

            const saveClass = () => {
                if (classForm.name.trim() === '') {
                    const newTimetable = { ...timetable };
                    delete newTimetable[selectedCell.key];
                    setTimetable(newTimetable);
                } else {
                    setTimetable({ ...timetable, [selectedCell.key]: classForm });
                }
                setIsClassModalOpen(false);
            };

            const deleteClass = () => {
                const newTimetable = { ...timetable };
                delete newTimetable[selectedCell.key];
                setTimetable(newTimetable);
                setIsClassModalOpen(false);
            };

            const addTodo = (e) => {
                e.preventDefault();
                if (!newTodo.trim()) return;
                const todo = { id: Date.now(), text: newTodo, deadline: newDeadline, completed: false };
                setTodos([...todos, todo].sort((a, b) => new Date(a.deadline || '9999-12-31') - new Date(b.deadline || '9999-12-31')));
                setNewTodo('');
                setNewDeadline('');
            };

            const toggleTodo = (id) => {
                setTodos(todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            };

            const deleteTodo = (id) => {
                setTodos(todos.filter(t => t.id !== id));
            };

            const addMemo = (e) => {
                e.preventDefault();
                if (!newMemo.trim()) return;
                const memo = { id: Date.now(), text: newMemo, date: new Date().toLocaleDateString() };
                setMemos([memo, ...memos]);
                setNewMemo('');
            };

            const deleteMemo = (id) => {
                setMemos(memos.filter(m => m.id !== id));
            };

            const addLink = (e) => {
                e.preventDefault();
                if (!newLinkTitle.trim() || !newLinkUrl.trim()) return;
                let url = newLinkUrl.trim();
                if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                const link = { id: Date.now(), title: newLinkTitle, url: url };
                setLinks([link, ...links]);
                setNewLinkTitle('');
                setNewLinkUrl('');
            };

            const deleteLink = (id) => {
                setLinks(links.filter(l => l.id !== id));
            };

            return (
                <div className="min-h-screen bg-[#f8fafc] text-slate-900 selection:bg-indigo-100">
                    {/* Decorative Background Elements */}
                    <div className="fixed inset-0 overflow-hidden pointer-events-none">
                        <div className="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-indigo-200/30 rounded-full blur-[120px]" />
                        <div className="absolute top-[20%] -right-[5%] w-[30%] h-[30%] bg-blue-200/20 rounded-full blur-[100px]" />
                        <div className="absolute -bottom-[10%] left-[20%] w-[50%] h-[50%] bg-emerald-100/30 rounded-full blur-[150px]" />
                    </div>

                    {/* Header */}
                    <header className="sticky top-0 z-40 bg-white/70 backdrop-blur-xl border-b border-white/40 shadow-sm">
                        <div className="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2.5 group">
                                <div className="w-10 h-10 bg-gradient-to-tr from-indigo-600 to-blue-500 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200 group-hover:scale-105 transition-transform">
                                    <GraduationCap className="w-6 h-6 text-white" />
                                </div>
                                <h1 className="text-xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-600">
                                    Campus<span className="text-indigo-600">Sync</span>
                                </h1>
                            </div>
                            <div className="hidden md:flex items-center gap-1 text-sm font-medium text-slate-500">
                                <Calendar className="w-4 h-4" />
                                <span>2026 Spring Semester</span>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-6 py-8 relative">
                        {/* Navigation Tabs */}
                        <nav className="flex items-center justify-center mb-10">
                            <div className="inline-flex p-1.5 bg-slate-200/50 backdrop-blur-md rounded-2xl border border-white shadow-inner">
                                {[
                                    { id: 'timetable', icon: Calendar, label: '時間割' },
                                    { id: 'todo', icon: CheckSquare, label: '課題' },
                                    { id: 'memo', icon: FileText, label: 'メモ' },
                                    { id: 'link', icon: Link, label: 'リンク' },
                                ].map((tab) => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-bold transition-all duration-300 ${
                                            activeTab === tab.id
                                                ? 'bg-white text-indigo-600 shadow-md translate-y-[-1px]'
                                                : 'text-slate-500 hover:text-slate-800 hover:bg-white/40'
                                        }`}
                                    >
                                        <tab.icon className={`w-4 h-4 ${activeTab === tab.id ? 'text-indigo-600' : 'text-slate-400'}`} />
                                        {tab.label}
                                    </button>
                                ))}
                            </div>
                        </nav>

                        {/* --- Timetable Section --- */}
                        {activeTab === 'timetable' && (
                            <div className="animate-in">
                                <div className="bg-white/60 backdrop-blur-md rounded-3xl border border-white/60 shadow-xl shadow-slate-200/50 overflow-hidden">
                                    <div className="p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                        <div>
                                            <h2 className="text-xl font-black text-slate-800 tracking-tight">Weekly Timetable</h2>
                                            <p className="text-xs font-semibold text-slate-400 mt-0.5 uppercase tracking-widest">Click a cell to edit schedule</p>
                                        </div>
                                    </div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full table-fixed">
                                            <thead>
                                                <tr className="bg-slate-50/50 border-b border-slate-100">
                                                    <th className="w-20 py-4 px-4"></th>
                                                    {days.map(day => (
                                                        <th key={day} className="py-4 px-4 text-center">
                                                            <span className="text-sm font-black text-slate-600">{day}</span>
                                                        </th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {periods.map((period, periodIndex) => (
                                                    <tr key={period} className="group border-b border-slate-50 last:border-0">
                                                        <td className="py-6 px-4 text-center align-middle bg-slate-50/30">
                                                            <span className="text-sm font-black text-slate-400 block">{period}</span>
                                                            <span className="text-[10px] font-bold text-indigo-400 mt-0.5">{periodTimes[periodIndex]}</span>
                                                        </td>
                                                        {days.map((_, dayIndex) => {
                                                            const key = `${dayIndex}-${periodIndex}`;
                                                            const cls = timetable[key];
                                                            return (
                                                                <td 
                                                                    key={key} 
                                                                    onClick={() => handleCellClick(dayIndex, periodIndex)}
                                                                    className="p-1 border-r border-slate-50 last:border-0 h-32 align-top"
                                                                >
                                                                    <div className={`group/cell relative h-full w-full rounded-2xl transition-all duration-300 cursor-pointer overflow-hidden ${
                                                                        cls 
                                                                            ? 'bg-gradient-to-br from-indigo-50 to-blue-50 border border-indigo-100 shadow-sm hover:shadow-md hover:scale-[1.02] p-3' 
                                                                            : 'border-2 border-dashed border-transparent hover:border-indigo-200 hover:bg-indigo-50/30 flex items-center justify-center'
                                                                    }`}>
                                                                        {cls ? (
                                                                            <>
                                                                                <div className="font-extrabold text-sm text-indigo-900 leading-tight mb-2 line-clamp-2">{cls.name}</div>
                                                                                {cls.room && (
                                                                                    <div className="flex items-center gap-1.5 text-[10px] font-bold text-indigo-600/80 mb-1">
                                                                                        <MapPin className="w-3 h-3" />
                                                                                        <span className="truncate">{cls.room}</span>
                                                                                    </div>
                                                                                )}
                                                                                {cls.teacher && (
                                                                                    <div className="text-[10px] font-medium text-slate-400 italic truncate">
                                                                                        {cls.teacher}
                                                                                    </div>
                                                                                )}
                                                                            </>
                                                                        ) : (
                                                                            <div className="w-8 h-8 rounded-full bg-indigo-50 flex items-center justify-center opacity-0 group-hover/cell:opacity-100 transition-opacity">
                                                                                <Plus className="w-4 h-4 text-indigo-400" />
                                                                            </div>
                                                                        )}
                                                                    </div>
                                                                </td>
                                                            );
                                                        })}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- Task Section --- */}
                        {activeTab === 'todo' && (
                            <div className="animate-in grid grid-cols-1 lg:grid-cols-12 gap-8">
                                <div className="lg:col-span-4">
                                    <div className="bg-white/60 backdrop-blur-md rounded-3xl border border-white/60 shadow-xl p-6 sticky top-24">
                                        <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center gap-2">
                                            <Plus className="w-5 h-5 text-indigo-500" />
                                            New Task
                                        </h3>
                                        <form onSubmit={addTodo} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 px-1">Task Title</label>
                                                <input
                                                    type="text"
                                                    value={newTodo}
                                                    onChange={(e) => setNewTodo(e.target.value)}
                                                    placeholder="e.g. Psychology Essay"
                                                    className="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all text-sm font-medium"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 px-1">Deadline</label>
                                                <input
                                                    type="date"
                                                    value={newDeadline}
                                                    onChange={(e) => setNewDeadline(e.target.value)}
                                                    className="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all text-sm font-medium"
                                                />
                                            </div>
                                            <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-2xl text-sm font-bold shadow-lg shadow-indigo-200 hover:shadow-indigo-300 transition-all active:scale-95 flex items-center justify-center gap-2">
                                                <Plus className="w-4 h-4" /> Add Task
                                            </button>
                                        </form>
                                    </div>
                                </div>
                                
                                <div className="lg:col-span-8">
                                    <div className="bg-white/60 backdrop-blur-md rounded-3xl border border-white/60 shadow-xl overflow-hidden">
                                        <div className="p-6 border-b border-slate-100 flex items-center justify-between">
                                            <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">
                                                <AlertCircle className="w-5 h-5 text-amber-500" />
                                                Pending Tasks
                                                <span className="ml-2 px-2.5 py-0.5 bg-amber-50 text-amber-600 text-xs font-black rounded-full">
                                                    {todos.filter(t => !t.completed).length}
                                                </span>
                                            </h3>
                                        </div>
                                        <div className="divide-y divide-slate-50">
                                            {todos.length === 0 ? (
                                                <div className="p-12 text-center">
                                                    <div className="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300">
                                                        <CheckSquare className="w-8 h-8" />
                                                    </div>
                                                    <p className="text-sm font-bold text-slate-400 italic">No tasks yet. Enjoy your day!</p>
                                                </div>
                                            ) : (
                                                todos.map(todo => (
                                                    <div key={todo.id} className={`p-5 flex items-center gap-4 group transition-all hover:bg-white/40 ${todo.completed ? 'opacity-50' : ''}`}>
                                                        <button 
                                                            onClick={() => toggleTodo(todo.id)}
                                                            className={`flex-shrink-0 w-6 h-6 rounded-lg border-2 flex items-center justify-center transition-all ${
                                                                todo.completed 
                                                                    ? 'bg-indigo-500 border-indigo-500 text-white' 
                                                                    : 'bg-white border-slate-200 text-transparent hover:border-indigo-400 group-hover:scale-110'
                                                            }`}
                                                        >
                                                            <CheckSquare className="w-4 h-4" />
                                                        </button>
                                                        <div className="flex-1 min-w-0">
                                                            <p className={`text-sm font-black transition-all ${todo.completed ? 'line-through text-slate-400' : 'text-slate-800'}`}>
                                                                {todo.text}
                                                            </p>
                                                            {todo.deadline && (
                                                                <div className="flex items-center gap-1.5 mt-1">
                                                                    <Clock className="w-3 h-3 text-slate-400" />
                                                                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-tighter">{todo.deadline}</span>
                                                                </div>
                                                            )}
                                                        </div>
                                                        <button 
                                                            onClick={() => deleteTodo(todo.id)}
                                                            className="w-9 h-9 flex items-center justify-center rounded-xl text-slate-300 hover:text-red-500 hover:bg-red-50 transition-all opacity-0 group-hover:opacity-100"
                                                        >
                                                            <Trash2 className="w-4 h-4" />
                                                        </button>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- Memo Section --- */}
                        {activeTab === 'memo' && (
                            <div className="animate-in grid grid-cols-1 lg:grid-cols-12 gap-8">
                                <div className="lg:col-span-4">
                                    <div className="bg-white/60 backdrop-blur-md rounded-3xl border border-white/60 shadow-xl p-6 sticky top-24">
                                        <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center gap-2">
                                            <FileText className="w-5 h-5 text-indigo-500" />
                                            Quick Memo
                                        </h3>
                                        <form onSubmit={addMemo} className="space-y-4">
                                            <textarea
                                                value={newMemo}
                                                onChange={(e) => setNewMemo(e.target.value)}
                                                placeholder="Write down anything..."
                                                className="w-full h-40 px-4 py-4 bg-white/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all text-sm font-medium resize-none shadow-inner"
                                                required
                                            />
                                            <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-2xl text-sm font-bold shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2 active:scale-95">
                                                Save Memo
                                            </button>
                                        </form>
                                    </div>
                                </div>
                                
                                <div className="lg:col-span-8">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {memos.length === 0 ? (
                                            <div className="col-span-full p-12 bg-white/40 border-2 border-dashed border-slate-200 rounded-3xl text-center">
                                                <p className="text-sm font-bold text-slate-400 italic">No notes saved.</p>
                                            </div>
                                        ) : (
                                            memos.map(memo => (
                                                <div key={memo.id} className="group bg-white/70 backdrop-blur-sm p-6 rounded-3xl border border-white/60 shadow-lg hover:shadow-xl transition-all hover:scale-[1.02] relative flex flex-col min-h-[160px]">
                                                    <p className="text-sm font-bold text-slate-700 whitespace-pre-wrap flex-1">{memo.text}</p>
                                                    <div className="mt-4 flex items-center justify-between">
                                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{memo.date}</span>
                                                        <button 
                                                            onClick={() => deleteMemo(memo.id)}
                                                            className="w-8 h-8 flex items-center justify-center rounded-full text-slate-300 hover:text-red-500 hover:bg-red-50 transition-all opacity-0 group-hover:opacity-100"
                                                        >
                                                            <Trash2 className="w-3.5 h-3.5" />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- Link Section --- */}
                        {activeTab === 'link' && (
                            <div className="animate-in grid grid-cols-1 lg:grid-cols-12 gap-8">
                                <div className="lg:col-span-4">
                                    <div className="bg-white/60 backdrop-blur-md rounded-3xl border border-white/60 shadow-xl p-6 sticky top-24">
                                        <h3 className="text-lg font-black text-slate-800 mb-6 flex items-center gap-2">
                                            <Link className="w-5 h-5 text-indigo-500" />
                                            Save URL
                                        </h3>
                                        <form onSubmit={addLink} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 px-1">Label</label>
                                                <input
                                                    type="text"
                                                    value={newLinkTitle}
                                                    onChange={(e) => setNewLinkTitle(e.target.value)}
                                                    placeholder="e.g. Portal"
                                                    className="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all text-sm font-medium"
                                                    required
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2 px-1">URL</label>
                                                <input
                                                    type="text"
                                                    value={newLinkUrl}
                                                    onChange={(e) => setNewLinkUrl(e.target.value)}
                                                    placeholder="e.g. example.com"
                                                    className="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all text-sm font-medium"
                                                    required
                                                />
                                            </div>
                                            <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-2xl text-sm font-bold shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2 active:scale-95">
                                                Add Link
                                            </button>
                                        </form>
                                    </div>
                                </div>
                                <div className="lg:col-span-8">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {links.map(link => (
                                            <div key={link.id} className="group bg-white/70 backdrop-blur-sm p-6 rounded-3xl border border-white/60 shadow-lg hover:shadow-xl transition-all hover:scale-[1.02] flex items-center justify-between">
                                                <a href={link.url} target="_blank" rel="noopener noreferrer" className="flex items-center gap-3 text-sm font-bold text-slate-700 hover:text-indigo-600 transition-colors">
                                                    <ExternalLink className="w-4 h-4 text-slate-400" />
                                                    {link.title}
                                                </a>
                                                <button 
                                                    onClick={() => deleteLink(link.id)}
                                                    className="w-8 h-8 flex items-center justify-center rounded-full text-slate-300 hover:text-red-500 hover:bg-red-50 transition-all opacity-0 group-hover:opacity-100"
                                                >
                                                    <Trash2 className="w-3.5 h-3.5" />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* --- Class Modal (時間割編集用のポップアップ) --- */}
                    {isClassModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-in">
                            <div className="bg-white rounded-3xl shadow-xl border border-slate-100 w-full max-w-md overflow-hidden animate-zoom-in">
                                <div className="p-6 border-b border-slate-50 flex items-center justify-between">
                                    <h3 className="text-lg font-black text-slate-800">講義情報の編集</h3>
                                    <button onClick={() => setIsClassModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                                        <X className="w-5 h-5" />
                                    </button>
                                </div>
                                <div className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">講義名</label>
                                        <input
                                            type="text"
                                            value={classForm.name}
                                            onChange={(e) => setClassForm({ ...classForm, name: e.target.value })}
                                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all text-sm font-medium"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">教室</label>
                                        <input
                                            type="text"
                                            value={classForm.room}
                                            onChange={(e) => setClassForm({ ...classForm, room: e.target.value })}
                                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all text-sm font-medium"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-black text-slate-400 uppercase tracking-widest mb-2">担当教員</label>
                                        <input
                                            type="text"
                                            value={classForm.teacher}
                                            onChange={(e) => setClassForm({ ...classForm, teacher: e.target.value })}
                                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-4 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all text-sm font-medium"
                                        />
                                    </div>
                                </div>
                                <div className="p-6 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-3">
                                    <button onClick={deleteClass} className="px-4 py-2.5 rounded-xl text-sm font-bold text-red-600 hover:bg-red-50 transition-colors">
                                        削除
                                    </button>
                                    <button onClick={saveClass} className="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-sm font-bold shadow-md shadow-indigo-100 transition-colors">
                                        保存
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
